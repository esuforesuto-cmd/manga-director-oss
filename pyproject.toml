[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "manga-director"
dynamic = ["version"]
description = "A headless, page-at-a-time commercial manga workflow engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "manga-director contributors" }]
keywords = ["manga", "workflow", "headless", "creative-tools", "agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "SQLAlchemy>=2.0,<3",
]

[project.scripts]
manga-director = "manga_director.cli.app:app"

[project.urls]
Homepage = "https://github.com/esuforesuto-cmd/manga-director-oss"
Documentation = "https://github.com/esuforesuto-cmd/manga-director-oss#readme"
Issues = "https://github.com/esuforesuto-cmd/manga-director-oss/issues"
Source = "https://github.com/esuforesuto-cmd/manga-director-oss"

[project.optional-dependencies]
openai = ["openai==3.0.0"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "twine>=5,<7",
]
postgresql = ["psycopg[binary]>=3.1,<4"]
migrations = ["alembic>=1.13,<2"]
api = ["fastapi>=0.110,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/manga_director"]
artifacts = ["src/manga_director/prompts/*.md"]

[tool.hatch.version]
path = "src/manga_director/_version.py"

[tool.hatch.build.targets.wheel.force-include]
"src/manga_director/py.typed" = "manga_director/py.typed"

[tool.hatch.build.targets.sdist]
include = [
  "/src/manga_director",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/RELEASE_V5_7.md",
  "/RELEASE_V6_0_RC1.md",
  "/RELEASE_V6_0.md",
  "/docs",
  "/examples",
]
exclude = [
  "/docs/roadmap/MD_POST_LTS_RFC_01_IMPLEMENTATION_PLAN.md",
  "/docs/roadmap/MD_POST_LTS_RFC_01_PROVIDER_NEUTRAL_REAL_IMAGE_GENERATION_DELIVERY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["manga_director"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["manga_director"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]
ignore = ["B008", "E501"] # Delivery-adapter calls and SQLAlchemy mapping readability.

[tool.ruff.lint.mccabe]
max-complexity = 12

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
