name: Windows fence diagnostic

on:
  push:
    branches:
      - diag/v7-17-win311-fence-timing

permissions:
  contents: read

concurrency:
  group: windows-fence-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-fence-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,api,openai]"
      - name: Run the targeted diagnostic up to five times
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "Diagnostic attempt $attempt of 5"
            python -m pytest -s --strict-markers "tests/test_local_file_revision_cas.py::test_project_commit_fence_contends_and_repeated_release_is_safe"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
